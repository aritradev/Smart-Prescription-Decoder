<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Logo Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Tilted Pill Icon (-45deg) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Top Half of Capsule -->
    <path d="M192,160 C192,124.65 220.65,96 256,96 C291.35,96 320,124.65 320,160 L320,256 L192,256 Z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Bottom Half of Capsule -->
    <path d="M192,256 L320,256 L320,352 C320,387.35 291.35,416 256,416 C220.65,416 192,387.35 192,352 Z" fill="#FFFFFF" opacity="0.7" />
    
    <!-- Divider Line -->
    <line x1="192" y1="256" x2="320" y2="256" stroke="url(#bgGrad)" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
